name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4
    steps:
      - uses: actions/checkout@v5

      # The core may not import SwiftUI, UIKit or SwiftData; building it on Linux enforces that.
      - name: Build and test PurrdayCore
        run: |
          swift --version
          swift build --package-path Core
          swift test --package-path Core
